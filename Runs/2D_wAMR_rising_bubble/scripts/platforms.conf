# Platform configuration file for ERF runs
# Format: platform.key = value
#
# Supported schedulers: slurm, flux, direct (no scheduler)
# For GPU platforms, set gpu_support=true and gpus_per_task

# =============================================================================
# Desktop/Workstation (default when LCHOST is undefined)
# =============================================================================
[desktop]
scheduler       = direct
ntasks          = 4
nnodes          = 1
cores_per_node  = 4
gpu_support     = false
mpi_launcher    = mpirun
queue           =
account         =
walltime        =
# Profiling tools (comma-separated alternatives)
profiler        = perf
profiler_cmd    = perf record -g -o perf.data
profiler_report = perf report -i perf.data

# =============================================================================
# DANE - CPU cluster with SLURM
# =============================================================================
[dane]
scheduler       = slurm
ntasks          = 108
nnodes          = 1
cores_per_node  = 112
gpu_support     = false
queue           = pbatch
debug_queue     = pdebug
account         = accatm
walltime        = 4:00:00
# Profiling: perf for CPU profiling, or Intel tools if available
profiler        = perf
profiler_cmd    = perf record -g -o perf.data
profiler_report = perf report -i perf.data

# =============================================================================
# MATRIX - GPU cluster with SLURM
# =============================================================================
[matrix]
scheduler       = slurm
ntasks          = 4
nnodes          = 1
cores_per_node  = 4
gpu_support     = true
gpus_per_task   = 1
queue           = pbatch
debug_queue     = pdebug
account         = accatm
walltime        = 4:00:00
# Profiling: NVIDIA Nsight Systems for GPU timeline, Nsight Compute for kernels
profiler        = nsys
profiler_cmd    = nsys profile --stats=true --output=profile
profiler_report = nsys stats profile.nsys-rep
# Alternative: ncu for detailed kernel analysis
profiler_alt    = ncu
profiler_alt_cmd = ncu --set full -o profile

# =============================================================================
# TUOLUMNE - Flux-based system with GPU support
# =============================================================================
[tuolumne]
scheduler       = flux
ntasks          = 4
nnodes          = 1
cores_per_node  = 4
gpu_support     = true
gpus_per_task   = 1
queue           = pbatch
debug_queue     = pdebug
account         = accatm
walltime        = 4h
# Extra environment variables needed for GPU MPI
env_vars        = MPICH_GPU_SUPPORT_ENABLED=1 HSA_XNACK=1
# Profiling: AMD ROCm profiler for GPU profiling
profiler        = rocprof
profiler_cmd    = rocprof --stats --basenames on -o profile.csv
profiler_report = cat profile.stats.csv
# Alternative: omniperf for detailed analysis
profiler_alt    = omniperf
profiler_alt_cmd = omniperf profile -n profile --
