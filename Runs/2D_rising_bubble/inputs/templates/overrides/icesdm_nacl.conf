# Override: Ice SuperDroplets with NaCl aerosol
# Extended domain height for ice-phase processes

# Modified geometry for ice cases
geometry.prob_extent = 20000.0 400.0  14000.0
amr.n_cell           = 200     4      140

# Moisture model
erf.moisture_model  = "SuperDroplets"

# Ice-phase plot variables
erf.plot_vars_1     = density rhotheta rhoQ1 rhoQ2 rhoQ3 rhoQ4 rhoQ5 rhoQ6 rhoadv_0 x_velocity y_velocity z_velocity pressure theta scalar temp pres_hse dens_hse pert_pres pert_dens eq_pot_temp qt qv qc qrain qi qsnow qgraup rain_accum accum_NaCl super_droplets_moisture_number_density super_droplets_moisture_mass_density super_droplets_moisture_species_mass_density_H2O super_droplets_moisture_species_mass_density_ice
particles.disable_plt = true

# SDM parameters
super_droplets_moisture.initial_distribution_type = "uniform"
super_droplets_moisture.diagnostics_interval = 100
super_droplets_moisture.coalescence_kernel = "Halls"
super_droplets_moisture.multiplicity_type = "constant"
super_droplets_moisture.recycle_particles = false
super_droplets_moisture.aerosols = NaCl
super_droplets_moisture.initial_aerosol_distribution_type_NaCl = "mass_exponential"
super_droplets_moisture.initial_aerosol_min_mass_NaCl = 1.0e-22 #kg
super_droplets_moisture.initial_aerosol_mean_mass_NaCl = 1.0e-19 #kg
super_droplets_moisture.initial_aerosol_max_mass_NaCl = 1.0e-18 #kg
super_droplets_moisture.initial_number_density = 1.0e7 #m^{-3}
super_droplets_moisture.initial_particles_per_cell = 128

# Bubble at higher altitude for ice formation
prob.z_c    =  8000.0
