# Override: SuperDroplets with NaCl injection
# Particles are injected during runtime (e.g., for seeding experiments)

# Moisture model
erf.moisture_model  = "SuperDroplets"

# Additional plot variables for SDM with particle density
erf.plot_vars_1     = density rhotheta rhoQ1 rhoQ2 rhoadv_0 x_velocity y_velocity z_velocity pressure theta scalar temp pres_hse dens_hse pert_pres pert_dens eq_pot_temp qt qv qc qrain rain_accum super_droplets_moisture_number_density super_droplets_moisture_mass_density super_droplets_moisture_sd_number_density
particles.disable_plt = true

# SDM parameters - no initial particles
super_droplets_moisture.initial_distribution_type = "uniform"
super_droplets_moisture.diagnostics_interval = 100
super_droplets_moisture.coalescence_kernel = "Halls"
super_droplets_moisture.multiplicity_type = "constant"
super_droplets_moisture.recycle_particles = false
super_droplets_moisture.aerosols = NaCl

super_droplets_moisture.initial_aerosol_distribution_type_NaCl = "mass_exponential"
super_droplets_moisture.initial_aerosol_min_mass_NaCl = 1.0e-22 #kg
super_droplets_moisture.initial_aerosol_mean_mass_NaCl = 1.0e-19 #kg
super_droplets_moisture.initial_aerosol_max_mass_NaCl = 1.0e-18 #kg
super_droplets_moisture.initial_number_density = 0.0e5 #m^{-3}
super_droplets_moisture.initial_particles_per_cell = 0

# Injection parameters
super_droplets_moisture.num_injections = 1
super_droplets_moisture.injection.distribution_type = "uniform"
super_droplets_moisture.injection.domain_velocity = 18.0 0.0 0.0
super_droplets_moisture.injection.particle_box_lo =  1000.0   0.0 5000.0
super_droplets_moisture.injection.particle_box_hi =  1400.0 400.0 5400.0
super_droplets_moisture.injection.aerosol_distribution_type_NaCl = "mass_exponential"
super_droplets_moisture.injection.aerosol_min_mass_NaCl = 1.0e-22 #kg
super_droplets_moisture.injection.aerosol_mean_mass_NaCl = 1.0e-19 #kg
super_droplets_moisture.injection.aerosol_max_mass_NaCl = 1.0e-18 #kg
super_droplets_moisture.injection.rate = 2.0e6 #m^{-3} s^{-1}
super_droplets_moisture.injection.particles_per_cell = 8
