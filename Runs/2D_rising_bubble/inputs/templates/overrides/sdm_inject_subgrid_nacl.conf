# Override: SuperDroplets with subgrid-scale NaCl injections
# Multiple small injection regions (box and bubble geometries)

# Moisture model
erf.moisture_model  = "SuperDroplets"

# Plot variables with aerosol mass density
erf.plot_vars_1     = density rhotheta rhoQ1 rhoQ2 rhoadv_0 x_velocity y_velocity z_velocity pressure theta scalar temp pres_hse dens_hse pert_pres pert_dens eq_pot_temp qt qv qc qrain rain_accum super_droplets_moisture_number_density super_droplets_moisture_mass_density super_droplets_moisture_sd_number_density super_droplets_moisture_aerosol_mass_density_NaCl accum_NaCl
particles.disable_plt = true

# SDM parameters - no initial particles
super_droplets_moisture.initial_distribution_type = "uniform"
super_droplets_moisture.diagnostics_interval = 100
super_droplets_moisture.coalescence_kernel = "Halls"
super_droplets_moisture.multiplicity_type = "constant"
super_droplets_moisture.recycle_particles = false
super_droplets_moisture.aerosols = NaCl

super_droplets_moisture.initial_aerosol_distribution_type_NaCl = "mass_exponential"
super_droplets_moisture.initial_aerosol_min_mass_NaCl = 1.0e-22 #kg
super_droplets_moisture.initial_aerosol_mean_mass_NaCl = 1.0e-19 #kg
super_droplets_moisture.initial_aerosol_max_mass_NaCl = 1.0e-18 #kg
super_droplets_moisture.initial_number_density = 0.0e5 #m^{-3}
super_droplets_moisture.initial_particles_per_cell = 0

# Two subgrid injections: box and bubble
super_droplets_moisture.num_injections = 2

super_droplets_moisture.injection.0.distribution_type = "uniform"
super_droplets_moisture.injection.0.particle_box_lo =  9020.0  10.0 2020.0
super_droplets_moisture.injection.0.particle_box_hi =  9040.0  40.0 2060.0
super_droplets_moisture.injection.0.aerosol_distribution_type_NaCl = "mass_exponential"
super_droplets_moisture.injection.0.aerosol_min_mass_NaCl = 1.0e-22 #kg
super_droplets_moisture.injection.0.aerosol_mean_mass_NaCl = 1.0e-19 #kg
super_droplets_moisture.injection.0.aerosol_max_mass_NaCl = 1.0e-18 #kg
super_droplets_moisture.injection.0.rate = 2.0e8 #m^{-3} s^{-1}
super_droplets_moisture.injection.0.particles_per_cell = 32

super_droplets_moisture.injection.1.distribution_type = "bubble"
super_droplets_moisture.injection.1.particle_bubble_center = 11030.0  25.0 2040.0
super_droplets_moisture.injection.1.particle_bubble_radius =    10.0  10.0   10.0
super_droplets_moisture.injection.1.aerosol_distribution_type_NaCl = "mass_exponential"
super_droplets_moisture.injection.1.aerosol_min_mass_NaCl = 1.0e-22 #kg
super_droplets_moisture.injection.1.aerosol_mean_mass_NaCl = 1.0e-19 #kg
super_droplets_moisture.injection.1.aerosol_max_mass_NaCl = 1.0e-18 #kg
super_droplets_moisture.injection.1.rate = 2.0e8 #m^{-3} s^{-1}
super_droplets_moisture.injection.1.particles_per_cell = 32
