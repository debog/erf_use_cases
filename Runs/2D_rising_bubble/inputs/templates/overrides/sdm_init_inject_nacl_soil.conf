# Override: SuperDroplets with initial NaCl + injected soil
# Dual aerosol: background NaCl with soil injection into bubble

# Moisture model
erf.moisture_model  = "SuperDroplets"

# Plot variables with both aerosol species
erf.plot_vars_1     = density rhotheta rhoQ1 rhoQ2 rhoadv_0 x_velocity y_velocity z_velocity pressure theta scalar temp pres_hse dens_hse pert_pres pert_dens eq_pot_temp qt qv qc qrain rain_accum super_droplets_moisture_number_density super_droplets_moisture_mass_density super_droplets_moisture_sd_number_density super_droplets_moisture_aerosol_mass_density_NaCl super_droplets_moisture_aerosol_mass_density_soil accum_NaCl accum_soil
particles.disable_plt = true

# SDM parameters - dual aerosol with initial NaCl
super_droplets_moisture.initial_distribution_type = "uniform"
super_droplets_moisture.diagnostics_interval = 100
super_droplets_moisture.coalescence_kernel = "Halls"
super_droplets_moisture.multiplicity_type = "constant"
super_droplets_moisture.recycle_particles = false
super_droplets_moisture.aerosols = NaCl soil

# Initial NaCl distribution
super_droplets_moisture.initial_aerosol_distribution_type_NaCl = "mass_exponential"
super_droplets_moisture.initial_aerosol_min_mass_NaCl = 1.0e-22 #kg
super_droplets_moisture.initial_aerosol_mean_mass_NaCl = 1.0e-19 #kg
super_droplets_moisture.initial_aerosol_max_mass_NaCl = 1.0e-18 #kg
# No initial soil (placeholder with negligible mass)
super_droplets_moisture.initial_aerosol_distribution_type_soil = "mass_constant"
super_droplets_moisture.initial_aerosol_mean_mass_soil = 1.0e-99 #kg
super_droplets_moisture.initial_number_density = 1.0e7 #m^{-3}
super_droplets_moisture.initial_particles_per_cell = 32

# Soil injection into bubble region
super_droplets_moisture.num_injections = 1
super_droplets_moisture.injection.distribution_type = "bubble"
super_droplets_moisture.injection.particle_bubble_center = 10000.0 200.0 2000.0
super_droplets_moisture.injection.particle_bubble_radius =  2000.0 400.0 2000.0
# No NaCl in injection (placeholder)
super_droplets_moisture.injection.aerosol_distribution_type_NaCl = "mass_constant"
super_droplets_moisture.injection.aerosol_mean_mass_NaCl = 1.0e-99 #kg
# Inject soil aerosol
super_droplets_moisture.injection.aerosol_distribution_type_soil = "mass_exponential"
super_droplets_moisture.injection.aerosol_min_mass_soil = 1.0e-22 #kg
super_droplets_moisture.injection.aerosol_mean_mass_soil = 1.0e-18 #kg
super_droplets_moisture.injection.rate = 2.0e6 #m^{-3} s^{-1}
super_droplets_moisture.injection.particles_per_cell = 4
