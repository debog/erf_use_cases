# Platform configuration file for ERF runs
# Format: platform.key = value
#
# Supported schedulers: slurm, flux, direct (no scheduler)
# For GPU platforms, set gpu_support=true and gpus_per_task

# =============================================================================
# Desktop/Workstation (default when LCHOST is undefined)
# =============================================================================
[desktop]
scheduler       = direct
ntasks          = 4
nnodes          = 1
gpu_support     = false
mpi_launcher    = mpirun
queue           =
account         =
walltime        =

# =============================================================================
# DANE - CPU cluster with SLURM
# =============================================================================
[dane]
scheduler       = slurm
ntasks          = 108
nnodes          = 1
cores_per_node  = 112
gpu_support     = false
queue           = pbatch
debug_queue     = pdebug
account         = accatm
walltime        = 1:00:00

# =============================================================================
# MATRIX - GPU cluster with SLURM
# =============================================================================
[matrix]
scheduler       = slurm
ntasks          = 4
nnodes          = 1
cores_per_node  = 4
gpu_support     = true
gpus_per_task   = 1
queue           = pbatch
debug_queue     = pdebug
account         = accatm
walltime        = 1:00:00

# =============================================================================
# TUOLUMNE - Flux-based system with GPU support
# =============================================================================
[tuolumne]
scheduler       = flux
ntasks          = 4
nnodes          = 1
cores_per_node  = 4
gpu_support     = true
gpus_per_task   = 1
queue           = pbatch
debug_queue     = pdebug
account         = accatm
walltime        = 1h
# Extra environment variables needed for GPU MPI
env_vars        = MPICH_GPU_SUPPORT_ENABLED=1 HSA_XNACK=1
